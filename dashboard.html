<!DOCTYPE html>
<html>
<head>
  <title>TerraPath Live Tracker</title>

  <meta charset="utf-8"/>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100vh;
    }

    .info-box {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;

      background: rgba(0,0,0,0.85);
      padding: 12px;
      border-radius: 10px;
      min-width: 280px;
    }

    .status {
      margin-top: 10px;
      font-weight: bold;
      font-size: 16px;
    }

    .inside {
      color: lime;
    }

    .outside {
      color: red;
    }
    .alert-speed {
      background: rgba(255,0,0,0.08);
      border-left: 3px solid rgba(255,0,0,0.35);
      padding: 6px;
      margin-bottom: 6px;
    }

    .alert-route {
      background: rgba(255,165,0,0.04);
      border-left: 3px solid rgba(255,165,0,0.25);
      padding: 6px;
      margin-bottom: 6px;
    }
    .fleet-item {
      padding:6px 4px;
      font-size:13px;
      cursor: default;
    }

    .fleet-item-selected {
      background: rgba(0,150,255,0.08);
      border-left: 3px solid rgba(0,150,255,0.25);
      padding:6px 4px;
    }
    
    /* Alerts panel scrolling */
    #alerts {
      max-height: 180px;
      overflow-y: auto;
      margin-top: 8px;
      font-size: 14px;
      padding-right: 6px;
    }
  </style>
</head>

<body>

<div class="info-box">

  <h2>TerraPath Tracker</h2>

  <div style="margin-bottom:8px">
    <label style="font-size:14px">
      Vehicle ID:
      <input id="vehicleIdInput" placeholder="Vehicle 01" style="width:120px;margin-left:6px" />
    </label>
    <br>
    <label style="font-size:14px">
      Speed Limit (km/h):
      <input id="speedLimitInput" type="number" value="40" style="width:72px;margin-left:6px" />
      <button onclick="setSpeedLimit()" style="margin-left:6px">Set</button>
    </label>
  </div>

  <div id="coords">
    Waiting for GPS...
  </div>

  <div id="selectedVehicle">
    Vehicle: --
  </div>

  <div id="distance">
    Distance: --
  </div>

  <div id="speed">
    Speed: --
  </div>

  <div id="status" class="status">
    Checking...
  </div>

  <div id="lastUpdate">
    Last update: --
  </div>

  <h3>Fleet Status</h3>

  <div id="fleetList">
    Loading vehicles...
  </div>

  <hr>

  <hr>

  <h3>Alerts</h3>

  <div id="alerts">
    No alerts
  </div>
  
  <hr>

  <h3>Trip Replay</h3>

  <button onclick="startReplay()">
  ▶ Play
  </button>

  <button onclick="stopReplay()">
  ■ Stop
  </button>

  <div id="replayStatus">
  Idle
  </div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

<script>

/////////////////////////////////////////////////////
// SEND ALERT
/////////////////////////////////////////////////////

// separate cooldowns for route and speed alerts
let lastRouteAlert = 0;
let lastSpeedAlert = 0;

async function sendAlert(distance, lat, lng, vehicle)
{
    const now = Date.now();

    // prevent spamming route-deviation alerts every 30 seconds
    if(now - lastRouteAlert < 30000)
    {
        return;
    }

    lastRouteAlert = now;

    const alert = {
      message: "Vehicle left approved route",
      distance: distance,
      latitude: lat,
      longitude: lng,
      vehicle: vehicle || ((vehicleIdInput && vehicleIdInput.value) ? vehicleIdInput.value : undefined)
    };

    try
    {
        await fetch(
          "https://terrapath-backend.onrender.com/alert",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(alert)
          }
        );

        console.log(
          "ALERT SENT",
          alert
        );
    }
    catch(err)
    {
        console.error(
          "Alert failed:",
          err
        );
    }
}

async function sendSpeedAlert(speed, lat, lng, vehicle)
{
  const now = Date.now();

  if(now - lastSpeedAlert < 30000)
  {
    return;
  }

  lastSpeedAlert = now;


  const alert = {
    type: "SPEED",
    message: "Speed limit exceeded",
    speed: speed,
    latitude: lat,
    longitude: lng,
    vehicle: vehicle || ((vehicleIdInput && vehicleIdInput.value) ? vehicleIdInput.value : undefined)
  };


  try
  {
    await fetch(
      "https://terrapath-backend.onrender.com/alert",
      {
      method: "POST",
      headers:{
        "Content-Type":"application/json"
      },
      body: JSON.stringify(alert)
      }
    );


    console.log(
      "SPEED ALERT SENT",
      alert
    );
  }
  catch(err)
  {
    console.error(
      "Speed alert failed",
      err
    );
  }
}

/////////////////////////////////////////////////////
// MAP
/////////////////////////////////////////////////////

const map = L.map("map").setView(
  [-0.2515, 35.9638],
  17
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution: "&copy; OpenStreetMap contributors"
  }
).addTo(map);

/////////////////////////////////////////////////////
// UI
/////////////////////////////////////////////////////

const coordsDiv =
  document.getElementById("coords");

const statusDiv =
  document.getElementById("status");

const distanceDiv =
  document.getElementById("distance");

const speedDiv =
  document.getElementById("speed");

const vehicleIdInput =
  document.getElementById("vehicleIdInput");

const speedLimitInput =
  document.getElementById("speedLimitInput");

function setSpeedLimit()
{
    const v = parseFloat(speedLimitInput.value);
    if(!isNaN(v) && v > 0){
        SPEED_LIMIT = v;
        console.log("SPEED_LIMIT set to", SPEED_LIMIT);
    }
}

const fleetList =
  document.getElementById("fleetList");

const alertsDiv =
  document.getElementById("alerts");

const selectedVehicleDiv =
  document.getElementById("selectedVehicle");

const lastUpdateDiv =
  document.getElementById("lastUpdate");

/////////////////////////////////////////////////////
// TRACKER OBJECTS
/////////////////////////////////////////////////////

// per-vehicle map objects for fleet mode
let vehicleMarkers = {};
let vehicleTrails = {};
let vehicleLines = {};
let vehicleTrailVisible = {};

let historyLine = null;
let replayMarker = null;
let replayIndex = 0;
let replayTimer = null;
let historyPoints = [];

// per-vehicle analytics/state
let previousPoints = {};
let previousTimes = {};
let isOverspeedingMap = {};
let isOffRouteMap = {};
let overspeedCounts = {};
let routeViolationCounts = {};

let SPEED_LIMIT = 40;

let roadsGeoJSON = null;
let routeBuffer = null;

/////////////////////////////////////////////////////
// LOAD ROADS
/////////////////////////////////////////////////////

fetch("exportroads.geojson")
.then(res => res.json())
.then(data => {

    roadsGeoJSON = data;

    L.geoJSON(data,{
        style:{
            color:"orange",
            weight:2
        }
    }).addTo(map);

    /////////////////////////////////////////////////////
    // CREATE 20M BUFFER
    /////////////////////////////////////////////////////

    const bufferedFeatures = [];

    data.features.forEach(feature => {

        try{

            const buffered =
              turf.buffer(
                feature,
                0.02,
                {
                  units:"kilometers"
                }
              );

            bufferedFeatures.push(buffered);

        }catch(e){

            console.warn(e);

        }

    });

    routeBuffer = {
        type:"FeatureCollection",
        features: bufferedFeatures
    };

    L.geoJSON(routeBuffer,{
        style:{
            color:"lime",
            fillColor:"lime",
            fillOpacity:0.15,
            weight:1
        }
    }).addTo(map);

    console.log(
      "Route buffer loaded"
    );

})
.catch(err => {

    console.error(
      "Road load error:",
      err
    );

});

/////////////////////////////////////////////////////
// DISTANCE TO ROAD
/////////////////////////////////////////////////////

function getNearestRoadDistance(
  lat,
  lng
){

    if(!roadsGeoJSON){
        return null;
    }

    const point =
      turf.point(
        [lng, lat]
      );

    let nearestDistance =
      Infinity;
    let nearestSnapped = null;

    roadsGeoJSON.features.forEach(
      feature => {

        try{

            const snapped =
              turf.nearestPointOnLine(
                feature,
                point
              );

            const dist =
              turf.distance(
                point,
                snapped,
                {
                  units:"meters"
                }
              );

            if(
              dist <
              nearestDistance
            ){

                nearestDistance =
                  dist;
                // GeoJSON coords are [lng, lat]
                nearestSnapped = snapped.geometry.coordinates.slice();

            }

        }catch(e){ }

      }
    );

    return {
      distance: nearestDistance,
      snapped: nearestSnapped // [lng, lat] or null
    };
}

/////////////////////////////////////////////////////
// LOAD HISTORY
/////////////////////////////////////////////////////

async function loadHistory()
{
  try
  {
    const response =
      await fetch(
        "https://terrapath-backend.onrender.com/events"
      );

    const events =
      await response.json();


    if(events.length < 2)
    {
      return;
    }


    const points =
      events.map(e => [
        e.lat,
        e.lng
      ]);

    // expose points to the replay system
    historyPoints = points;


    if(historyLine)
    {
      map.removeLayer(
        historyLine
      );
    }


    historyLine =
      L.polyline(
        points,
        {
          color: "yellow",
          weight: 3,
          opacity: 0.6
        }
      )
      .addTo(map);


  }
  catch(error)
  {
    console.error(
      "History error:",
      error
    );
  }
}

/////////////////////////////////////////////////////
// TRIP REPLAY
/////////////////////////////////////////////////////

function startReplay()
{
  if(historyPoints.length < 2)
  {
    alert(
      "Not enough trip data"
    );
    return;
  }


  stopReplay();


  replayIndex = 0;


  replayTimer =
  setInterval(() => {

    const point =
      historyPoints[replayIndex];


    if(!replayMarker)
    {
      replayMarker =
      L.marker(point)
      .addTo(map);
    }
    else
    {
      replayMarker
      .setLatLng(point);
    }


    map.panTo(point);


    document
    .getElementById("replayStatus")
    .innerHTML =
    "Replaying " +
    (replayIndex + 1)
    + " / " +
    historyPoints.length;


    replayIndex++;


    if(replayIndex >= historyPoints.length)
    {
      stopReplay();
    }


  }, 500);


}


function stopReplay()
{
  clearInterval(
    replayTimer
  );

  replayTimer = null;


  document
  .getElementById("replayStatus")
  .innerHTML =
  "Stopped";
}

/////////////////////////////////////////////////////
// GPS LOOP
/////////////////////////////////////////////////////

/////////////////////////////////////////////////////
// LOAD ALERTS
/////////////////////////////////////////////////////

async function updateAlerts()
{
    try
    {
        const response =
          await fetch(
            "https://terrapath-backend.onrender.com/alerts"
          );

        const alerts =
          await response.json();


        // if a vehicle is selected, show alerts for that vehicle only
        const selectedVehicleId = (vehicleIdInput && vehicleIdInput.value) ? vehicleIdInput.value.trim() : null;
        if(selectedVehicleId){
            alerts = alerts.filter(a => a.vehicle === selectedVehicleId);
        }

        if(alerts.length === 0)
        {
            alertsDiv.innerHTML =
              "No alerts";
            return;
        }


        alertsDiv.innerHTML =
          alerts
          .slice()
          .reverse()
          .slice(0,5)
          .map(a => {
              const vehicleHtml = a.vehicle ? `<b>Vehicle:</b> ${a.vehicle}<br>` : "";

              if(a.type === 'SPEED' || a.speed){
                  return `
                    <div class="alert-speed">
                      <b>Time:</b> ${a.timestamp}<br>
                      ${vehicleHtml}
                      <b>Speed:</b> ${ (a.speed||0).toFixed ? a.speed.toFixed(2) + ' km/h' : a.speed + ' km/h' }<br>
                      <span style="color:red">${a.message}</span>
                    </div>
                  `;
              }

              // fallback: route alert
              return `
                <div class="alert-route">
                  <b>Time:</b> ${a.timestamp}<br>
                  ${vehicleHtml}
                  <b>Distance:</b> ${a.distance ? a.distance.toFixed(2) + ' m' : '-'}<br>
                  <span style="color:orange">${a.message}</span>
                </div>
              `;
          }).join("");

    }
    catch(err)
    {
        console.error(
          "Alert load failed:",
          err
        );
    }
}


async function updateLocation(){

    try{

        const response =
          await fetch(
            "https://terrapath-backend.onrender.com/location"
          );

        const vehicles =
          await response.json();

        if(
          Object.keys(vehicles).length === 0
        ){
            return;
        }

        // fleet UI
        fleetList.innerHTML = "";

        // determine selected vehicle (from input) or auto-select single vehicle
        const selectedVehicleId = (vehicleIdInput && vehicleIdInput.value) ? vehicleIdInput.value.trim() : null;
        const vehicleIds = Object.keys(vehicles);
        const singleVehicle = vehicleIds.length === 1;

        for(const id of vehicleIds)
        {
            const data = vehicles[id];

            const lat = data.lat;
            const lng = data.lng;

            // create fleet list item with select and toggle buttons
            const item = document.createElement('div');
            item.className = 'fleet-item';

            const title = document.createElement('div');
            title.innerHTML = `🚚 <b>${id}</b>`;

            const seen = document.createElement('div');
            seen.style.fontSize = '12px';
            seen.style.opacity = '0.9';
            seen.innerText = `Last seen: ${data.timestamp || ''}`;

            const controls = document.createElement('div');
            controls.style.marginTop = '4px';

            const selectBtn = document.createElement('button');
            selectBtn.innerText = 'Select';
            selectBtn.style.marginRight = '6px';
            selectBtn.onclick = () => {
              vehicleIdInput.value = id;
              // immediately refresh UI for the selected vehicle
              try{ updateLocation(); }catch(e){}
              try{ map.panTo([lat,lng]); }catch(e){}
            };

            const toggleBtn = document.createElement('button');
            toggleBtn.innerText = vehicleTrailVisible[id] === false ? 'Show Trail' : 'Hide Trail';
            toggleBtn.onclick = () => {
              // toggle trail visibility
              if(vehicleLines[id]){
                if(map.hasLayer(vehicleLines[id])){
                  map.removeLayer(vehicleLines[id]);
                  vehicleTrailVisible[id] = false;
                  toggleBtn.innerText = 'Show Trail';
                } else {
                  vehicleLines[id].addTo(map);
                  vehicleTrailVisible[id] = true;
                  toggleBtn.innerText = 'Hide Trail';
                }
              }
            };

            controls.appendChild(selectBtn);
            controls.appendChild(toggleBtn);

            item.appendChild(title);
            item.appendChild(seen);
            item.appendChild(controls);

            // mark selected
            if((selectedVehicleId && selectedVehicleId === id) || (!selectedVehicleId && singleVehicle)){
              item.classList.add('fleet-item-selected');
            }

            fleetList.appendChild(item);
            const hr = document.createElement('hr');
            fleetList.appendChild(hr);

            // roadmap snapping
            const roadInfo = getNearestRoadDistance(lat,lng);

            let displayLat = lat;
            let displayLng = lng;

            if(roadInfo && roadInfo.snapped){
                displayLng = roadInfo.snapped[0];
                displayLat = roadInfo.snapped[1];
            }

            // marker
            if(!vehicleMarkers[id]){
              vehicleMarkers[id] = L.marker([displayLat, displayLng])
                .addTo(map)
                .bindPopup("Vehicle: " + id);
            } else {
                vehicleMarkers[id].setLatLng([displayLat, displayLng]);
            }

            // trail
            if(!vehicleTrails[id]) vehicleTrails[id] = [];

            if(roadInfo && roadInfo.snapped){
                vehicleTrails[id].push([roadInfo.snapped[1], roadInfo.snapped[0]]);
            } else {
                vehicleTrails[id].push([lat,lng]);
            }

            if(vehicleTrails[id].length > 200) vehicleTrails[id].shift();

            if(!vehicleLines[id]){
              vehicleLines[id] = L.polyline(vehicleTrails[id],{color:'cyan', weight:3}).addTo(map);
              vehicleTrailVisible[id] = true;
            }else{
                vehicleLines[id].setLatLngs(vehicleTrails[id]);
            }

            // speed calculation per vehicle
            const now = new Date();
            let speedVal = null;

            if(previousPoints[id]){
                const distKm = turf.distance(
                    turf.point([previousPoints[id].lng, previousPoints[id].lat]),
                    turf.point([lng, lat]),
                    {units:'kilometers'}
                );

                const hours = (now - previousTimes[id]) / 3600000;
                speedVal = hours > 0 ? distKm / hours : 0;

                // overspeed state machine per vehicle
                if(speedVal > SPEED_LIMIT){
                    if(!isOverspeedingMap[id]){
                        overspeedCounts[id] = (overspeedCounts[id] || 0) + 1;
                        sendSpeedAlert(speedVal, lat, lng, id);
                        isOverspeedingMap[id] = true;
                    }
                } else {
                    isOverspeedingMap[id] = false;
                }
            }

            previousPoints[id] = {lat: lat, lng: lng};
            previousTimes[id] = now;

            // update main UI only for selected vehicle (or single auto-selected)
            const isSelected = (selectedVehicleId && selectedVehicleId === id) || (!selectedVehicleId && singleVehicle);

            if(isSelected){
              // show selected vehicle header and last update
              if(selectedVehicleDiv){
                selectedVehicleDiv.innerHTML = `<b>Vehicle:</b> ${id}`;
              }
              if(lastUpdateDiv){
                lastUpdateDiv.innerHTML = `<b>Last update:</b> ${data.timestamp || ''}`;
              }
                coordsDiv.innerHTML = `\n                  <b>Latitude:</b> ${lat}<br>\n                  <b>Longitude:</b> ${lng}\n                `;

                distanceDiv.innerHTML = `<b>Road Distance:</b> ${ (roadInfo? roadInfo.distance : 0).toFixed(2)} m`;

                if(speedVal !== null){
                    if(speedVal > SPEED_LIMIT){
                        speedDiv.innerHTML = `<span style="color:red">Speed: ${speedVal.toFixed(2)} km/h ⚠</span>`;
                    } else {
                        speedDiv.innerHTML = `<b>Speed:</b> ${speedVal.toFixed(2)} km/h`;
                    }
                }

                // route status per vehicle
                const roadDistance = roadInfo ? roadInfo.distance : null;
                if(roadDistance !== null){
                    if(roadDistance <= 10){
                        isOffRouteMap[id] = false;
                        statusDiv.innerHTML = "ON APPROVED ROUTE";
                        statusDiv.className = "status inside";
                    } else if(roadDistance <= 25){
                        statusDiv.innerHTML = "WARNING: LEAVING ROUTE";
                        statusDiv.className = "status";
                    } else {
                        statusDiv.innerHTML = "ROUTE DEVIATION";
                        statusDiv.className = "status outside";

                        if(!isOffRouteMap[id]){
                            routeViolationCounts[id] = (routeViolationCounts[id] || 0) + 1;
                            sendAlert(roadDistance, lat, lng, id);
                            isOffRouteMap[id] = true;
                        }
                    }
                }

                // follow single vehicle if in single mode
                if(singleVehicle){
                    map.panTo([lat, lng]);
                }
            }

        }

    }
    catch(err){

        console.error(
          "GPS Error:",
          err
        );

    }

}

setInterval(
  updateLocation,
  2000
);

updateLocation();

setInterval(
  updateAlerts,
  5000
);

updateAlerts();

// load history once and refresh periodically
loadHistory();

setInterval(
    loadHistory,
    10000
);

</script>
</body>
</html>
