<!DOCTYPE html>
<html>
<head>
  <title>TerraPath Live Tracker</title>

  <meta charset="utf-8"/>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100vh;
    }

    .info-box {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;

      background: rgba(0,0,0,0.85);
      padding: 12px;
      border-radius: 10px;
      min-width: 280px;
    }

    .status {
      margin-top: 10px;
      font-weight: bold;
      font-size: 16px;
    }

    .inside {
      color: lime;
    }

    .outside {
      color: red;
    }
  </style>
</head>

<body>

<div class="info-box">

  <h2>TerraPath Tracker</h2>

  <div id="coords">
    Waiting for GPS...
  </div>

  <div id="distance">
    Distance: --
  </div>

  <div id="status" class="status">
    Checking...
  </div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

<script>

/////////////////////////////////////////////////////
// SEND ALERT
/////////////////////////////////////////////////////

let lastAlertTime = 0;

async function sendAlert(distance, lat, lng)
{
    const now = Date.now();

    // prevent spamming alerts every 30 seconds
    if(now - lastAlertTime < 30000)
    {
        return;
    }

    lastAlertTime = now;

    const alert = {
        message: "Vehicle left approved route",
        distance: distance,
        latitude: lat,
        longitude: lng
    };

    try
    {
        await fetch(
          "https://terrapath-backend.onrender.com/alert",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(alert)
          }
        );

        console.log(
          "ALERT SENT",
          alert
        );
    }
    catch(err)
    {
        console.error(
          "Alert failed:",
          err
        );
    }
}

/////////////////////////////////////////////////////
// MAP
/////////////////////////////////////////////////////

const map = L.map("map").setView(
  [-0.2515, 35.9638],
  17
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution: "&copy; OpenStreetMap contributors"
  }
).addTo(map);

/////////////////////////////////////////////////////
// UI
/////////////////////////////////////////////////////

const coordsDiv =
  document.getElementById("coords");

const statusDiv =
  document.getElementById("status");

const distanceDiv =
  document.getElementById("distance");

/////////////////////////////////////////////////////
// TRACKER OBJECTS
/////////////////////////////////////////////////////

let marker = null;
let trail = [];
let trailLine = null;

let roadsGeoJSON = null;
let routeBuffer = null;

/////////////////////////////////////////////////////
// LOAD ROADS
/////////////////////////////////////////////////////

fetch("exportroads.geojson")
.then(res => res.json())
.then(data => {

    roadsGeoJSON = data;

    L.geoJSON(data,{
        style:{
            color:"orange",
            weight:2
        }
    }).addTo(map);

    /////////////////////////////////////////////////////
    // CREATE 20M BUFFER
    /////////////////////////////////////////////////////

    const bufferedFeatures = [];

    data.features.forEach(feature => {

        try{

            const buffered =
              turf.buffer(
                feature,
                0.02,
                {
                  units:"kilometers"
                }
              );

            bufferedFeatures.push(buffered);

        }catch(e){

            console.warn(e);

        }

    });

    routeBuffer = {
        type:"FeatureCollection",
        features: bufferedFeatures
    };

    L.geoJSON(routeBuffer,{
        style:{
            color:"lime",
            fillColor:"lime",
            fillOpacity:0.15,
            weight:1
        }
    }).addTo(map);

    console.log(
      "Route buffer loaded"
    );

})
.catch(err => {

    console.error(
      "Road load error:",
      err
    );

});

/////////////////////////////////////////////////////
// DISTANCE TO ROAD
/////////////////////////////////////////////////////

function getNearestRoadDistance(
  lat,
  lng
){

    if(!roadsGeoJSON){
        return null;
    }

    const point =
      turf.point(
        [lng, lat]
      );

    let nearestDistance =
      Infinity;
    let nearestSnapped = null;

    roadsGeoJSON.features.forEach(
      feature => {

        try{

            const snapped =
              turf.nearestPointOnLine(
                feature,
                point
              );

            const dist =
              turf.distance(
                point,
                snapped,
                {
                  units:"meters"
                }
              );

            if(
              dist <
              nearestDistance
            ){

                nearestDistance =
                  dist;
                // GeoJSON coords are [lng, lat]
                nearestSnapped = snapped.geometry.coordinates.slice();

            }

        }catch(e){ }

      }
    );

    return {
      distance: nearestDistance,
      snapped: nearestSnapped // [lng, lat] or null
    };
}

/////////////////////////////////////////////////////
// GPS LOOP
/////////////////////////////////////////////////////

async function updateLocation(){

    try{

        const response =
          await fetch(
            "https://terrapath-backend.onrender.com/location"
          );

        const data =
          await response.json();

        if(
          data.lat === undefined ||
          data.lng === undefined
          ){
            return;
          }

        const lat =
          data.lat;

        const lng =
          data.lng;

        /////////////////////////////////////////////////////
        // COORDS
        /////////////////////////////////////////////////////

        coordsDiv.innerHTML = `
          <b>Latitude:</b> ${lat}<br>
          <b>Longitude:</b> ${lng}
        `;

        /////////////////////////////////////////////////////
        // MARKER (snapped to road)
        /////////////////////////////////////////////////////

        // get nearest road and snapped point
        const roadInfo =
          getNearestRoadDistance(
            lat,
            lng
          );

        let displayLat = lat;
        let displayLng = lng;

        if(
          roadInfo &&
          roadInfo.snapped
        ){
            // snapped is [lng, lat]
            displayLng = roadInfo.snapped[0];
            displayLat = roadInfo.snapped[1];
        }

        if(!marker){

            marker =
              L.marker(
                [displayLat,displayLng]
              ).addTo(map);

            map.setView(
              [displayLat,displayLng],
              18
            );

        }else{

            marker.setLatLng(
              [displayLat,displayLng]
            );

        }

        /////////////////////////////////////////////////////
        // Hidden actual GPS marker
        /////////////////////////////////////////////////////

        if(typeof window.actualMarker === 'undefined'){
          // keep actual GPS hidden for debugging if needed
          window.actualMarker = L.circleMarker([lat,lng],{
            radius: 4,
            color: '#888',
            opacity: 0,
            fillOpacity: 0
          }).addTo(map);
        }else{
          window.actualMarker.setLatLng([lat,lng]);
        }

        /////////////////////////////////////////////////////
        // FOLLOW GPS
        /////////////////////////////////////////////////////

        const FOLLOW_MODE = true;
        
        if(FOLLOW_MODE){
          map.panTo([lat,lng]);
        }

        /////////////////////////////////////////////////////
        // TRAIL (store/display snapped positions)
        /////////////////////////////////////////////////////

        // push snapped coords if available, otherwise raw
        if(
          roadInfo &&
          roadInfo.snapped
        ){
            trail.push([
              roadInfo.snapped[1],
              roadInfo.snapped[0]
            ]);
        }else{
            trail.push([
              lat,lng
            ]);
        }

        if(
          trail.length > 200
        ){
          trail.shift();
        }

        if(!trailLine){
          
          trailLine = L.polyline(
            trail,
            {
              color:"cyan",
              weight:4
            }
            ).addTo(map);
          
          }else{

            trailLine.setLatLngs(trail);
          }

        /////////////////////////////////////////////////////
        // DISTANCE TO ROAD
        /////////////////////////////////////////////////////

        // use the already-computed `roadInfo` to avoid
        // calling getNearestRoadDistance twice
        const roadDistance =
          roadInfo ? roadInfo.distance : null;

        if(
          roadDistance !== null
        ){

            distanceDiv.innerHTML =
              `<b>Road Distance:</b> ${roadDistance.toFixed(2)} m`;

            /////////////////////////////////////////////////////
            // ROUTE STATUS
            /////////////////////////////////////////////////////

            if(
              roadDistance <= 10
            ){

                statusDiv.innerHTML =
                  "ON APPROVED ROUTE";

                statusDiv.className =
                  "status inside";

            }
            else if(
              roadDistance <= 25
            ){

                statusDiv.innerHTML =
                  "WARNING: LEAVING ROUTE";

                statusDiv.className =
                  "status";

            }
            else{

                statusDiv.innerHTML =
                  "ROUTE DEVIATION";

                statusDiv.className =
                  "status outside";

                // send an alert to the backend (rate-limited)
                sendAlert(
                    roadDistance,
                    lat,
                    lng
                );

            }
        }

    }
    catch(err){

        console.error(
          "GPS Error:",
          err
        );

    }
}

setInterval(
  updateLocation,
  2000
);

updateLocation();

</script>
</body>
</html>
